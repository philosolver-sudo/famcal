name: Kalenderbild aktualisieren

on:
  schedule:
    # Alle 30 Minuten. GitHub kann bei kostenlosen Repos etwas Verspaetung
    # haben (das ist fuer einen Familienkalender unproblematisch).
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # erlaubt manuelles Ausloesen ueber die GitHub-Oberflaeche

# Nie zwei Laeufe gleichzeitig
concurrency:
  group: calendar-update
  cancel-in-progress: false

# Rechte fuer die direkte Pages-Veroeffentlichung (kein Commit noetig)
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Kalenderbild rendern
        env:
          ICS_URLS: ${{ secrets.ICS_URLS }}
          CALENDAR_NAMES: ${{ vars.CALENDAR_NAMES }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD }}
          TIMEZONE: "Europe/Berlin"
          TITLE: "Familienkalender"
        run: python render_calendar.py

      - name: PNG fuer Kindle bereinigen (pngcrush)
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq pngcrush
          pngcrush -ow docs/calendar.png

      # Ab hier neu: das Bild wird direkt veroeffentlicht statt committet.
      - name: Inhalt als Pages-Artefakt verpacken
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Auf GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
